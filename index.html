<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Pisos - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul: #1a3a5c;
            --azul-escuro: #0f2538;
            --laranja: #e87b0c;
            --laranja-hover: #d06d08;
            --cinza-claro: #f5f7fa;
            --cinza: #8898aa;
            --vermelho: #e74c3c;
            --verde: #27ae60;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--cinza-claro);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(26,58,92,0.12);
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
            text-align: center;
        }
        .logo-area { margin-bottom: 32px; }
        .logo-area img {
            width: 160px;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
        }
        .logo-area h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--azul);
            margin-top: 16px;
        }
        .logo-area p {
            color: var(--cinza);
            font-size: 14px;
            margin-top: 4px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--azul);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8ecf1;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background: #fafbfc;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--laranja);
            background: #fff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--laranja);
            color: #fff;
        }
        .btn-primary:hover { background: var(--laranja-hover); transform: translateY(-1px); }
        .btn-secondary {
            background: transparent;
            color: var(--azul);
            border: 2px solid #e8ecf1;
            margin-top: 12px;
        }
        .btn-secondary:hover { border-color: var(--laranja); color: var(--laranja); }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-error { background: #fdeaea; color: var(--vermelho); border: 1px solid #f5c6cb; }
        .alert-success { background: #e8f5e9; color: var(--verde); border: 1px solid #c8e6c9; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 32px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal h3 {
            font-size: 18px;
            color: var(--azul);
            margin-bottom: 20px;
        }
        .modal .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal .btn-group .btn { flex: 1; margin-top: 0; }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-info {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e8ecf1;
            font-size: 12px;
            color: var(--cinza);
        }
    </style>
</head>

                <button class="btn btn-primary" onclick="alterarSenha()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, updatePassword, EmailAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB69vosfyEjsIeAWDorU9jPhnna4rYIO6E",
            authDomain: "lucas-pisos-sistema.firebaseapp.com",
            databaseURL: "https://lucas-pisos-sistema-default-rtdb.firebaseio.com",
            projectId: "lucas-pisos-sistema",
            storageBucket: "lucas-pisos-sistema.firebasestorage.app",
            messagingSenderId: "426472953709",
            appId: "1:426472953709:web:2668e0edd72486f69a2c64"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Verifica se já está logado
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'painel.html';
            }
        });

        function showAlert(id, msg, type) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = 'alert alert-' + type;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function setLoading(loading) {
            document.getElementById('spinner').style.display = loading ? 'block' : 'none';
            document.getElementById('btnText').style.display = loading ? 'none' : 'inline';
            document.getElementById('btnLogin').disabled = loading;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);
            try {
                await signInWithEmailAndPassword(auth, email.value, password.value);
                window.location.href = 'painel.html';
            } catch (err) {
                let msg = 'Erro ao fazer login';
                if (err.code === 'auth/user-not-found') msg = 'E-mail não encontrado';
                if (err.code === 'auth/wrong-password') msg = 'Senha incorreta';
                if (err.code === 'auth/invalid-email') msg = 'E-mail inválido';
                if (err.code === 'auth/invalid-credential') msg = 'E-mail ou senha incorretos';
                showAlert('alert', msg, 'error');
                setLoading(false);
            }
        });

        window.openModal = (id) => document.getElementById(id).classList.add('active');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');

        window.alterarSenha = async () => {
            const emailVal = document.getElementById('emailSenha').value;
            const senhaAtual = document.getElementById('senhaAtual').value;
            const novaSenha = document.getElementById('novaSenha').value;

            if (!emailVal || !senhaAtual || !novaSenha) {
                showAlert('alertSenha', 'Preencha todos os campos', 'error');
                return;
            }
            if (novaSenha.length < 6) {
                showAlert('alertSenha', 'Nova senha precisa ter no mínimo 6 caracteres', 'error');
                return;
            }

            try {
                const userCred = await signInWithEmailAndPassword(auth, emailVal, senhaAtual);
                await updatePassword(userCred.user, novaSenha);
                showAlert('alertSenha', 'Senha alterada com sucesso!', 'success');
                setTimeout(() => closeModal('modalAlterarSenha'), 1500);
            } catch (err) {
                let msg = 'Erro ao alterar senha';
                if (err.code === 'auth/wrong-password') msg = 'Senha atual incorreta';
                if (err.code === 'auth/invalid-credential') msg = 'E-mail ou senha atual incorretos';
                showAlert('alertSenha', msg, 'error');
            }
        };
    </script>
</body>

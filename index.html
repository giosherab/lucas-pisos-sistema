<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucas Pisos - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:linear-gradient(135deg,#0a0e17 0%,#0d1421 50%,#1a3a5c 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-box{
  background:linear-gradient(180deg,#111827,#0f172a);
  border:1px solid #1e3a5f;
  border-radius:20px;
  padding:48px 40px;
  width:100%;
  max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 40px rgba(232,123,12,0.1);
  text-align:center;
}
.logo-icon{
  width:80px;height:80px;
  background:linear-gradient(135deg,#e87b0c,#f5a623);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
  box-shadow:0 8px 24px rgba(232,123,12,0.4);
  font-size:36px;
}
h1{color:#fff;margin:0 0 4px;font-size:28px;font-weight:800}
h1 span{color:#e87b0c}
.subtitle{color:#8ab4d9;font-size:13px;margin-bottom:32px}
.input-group{text-align:left;margin-bottom:16px}
.input-group label{color:#8ab4d9;font-size:12px;font-weight:600;display:block;margin-bottom:6px}
.input-group input{
  width:100%;padding:14px 16px;border-radius:10px;
  border:1px solid #1e3a5f;background:#0d1f33;color:#fff;
  font-size:15px;outline:none;transition:border-color .2s;
}
.input-group input:focus{border-color:#e87b0c}
.input-group input::placeholder{color:#5a7a9a}
.btn-login{
  width:100%;padding:16px;border-radius:10px;border:none;
  background:linear-gradient(135deg,#e87b0c,#f5a623);
  color:#fff;font-size:16px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 16px rgba(232,123,12,0.3);
  transition:all .2s;margin-top:8px;
}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,123,12,0.4)}
.erro{color:#ef4444;font-size:13px;margin-top:12px;min-height:20px}
.rodape{color:#5a7a9a;font-size:11px;margin-top:32px}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo-icon">🏠</div>
  <h1><span>LUCAS</span> PISOS</h1>
  <p class="subtitle">Sistema de Gestão • Estoque & Vendas</p>

  <div class="input-group">
    <label>👤 Usuário</label>
    <input type="text" id="usuario" placeholder="Digite seu usuário" value="admin" onkeypress="if(event.key==='Enter')document.getElementById('senha').focus()">
  </div>
  <div class="input-group">
    <label>🔒 Senha</label>
    <input type="password" id="senha" placeholder="Digite sua senha" value="lucas2026" onkeypress="if(event.key==='Enter')fazerLogin()">
  </div>

  <button class="btn-login" onclick="fazerLogin()">🔐 Entrar no Sistema</button>
  <div class="erro" id="erro"></div>

  <p class="rodape">© Lucas Pisos • Sistema exclusivo</p>
</div>

<script>
function fazerLogin(){
  const u=document.getElementById('usuario').value.trim();
  const s=document.getElementById('senha').value.trim();
  const e=document.getElementById('erro');
  if(!u||!s){e.textContent='Preencha usuário e senha!';return;}
  if(u==='admin'&&s==='lucas2026'){
    localStorage.setItem('lucas_pisos_auth','logado_'+Date.now());
    window.location.href='painel.html';
  }else{
    e.textContent='❌ Usuário ou senha incorretos!';
    document.getElementById('senha').value='';
    document.getElementById('senha').focus();
  }
}
if(localStorage.getItem('lucas_pisos_auth')){
  window.location.href='painel.html';
}
</script>
</body>
</html>
